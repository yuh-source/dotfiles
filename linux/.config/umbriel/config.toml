# Umbriel default config
# Copy this file to ~/.config/umbriel/config.toml to customize it.
# Changes apply on save. See docs/user/ for the full reference.

[include]
files = [
    "design.toml",
    "keybinds.toml",
    "rules.toml",
]

[general]
autostart = [
    "noctalia -d",
    "vicinae server",
    "brave",
    "kitty",
    "discord",
    "spotify",
    "spawn:~/.scripts/applications/gsr/start.sh",
]

xwayland = true                 # requires xwayland-satellite on PATH; restart to change
show_cheatsheet = false         # show keybinds overlay on startup
focus_on_activate = false       # unsolicited requests cannot add focus; trusted launches may still focus
honor_restored_maximize = false # let apps restore their saved maximized state

[environment]
GTK_THEME = "Adwaita:dark"
QT_QPA_PLATFORMTHEME = "qt5ct"

[workspaces]
back_and_forth = false
empty_above = false


# Outputs (see docs/user/outputs.md) ----------------------------------------

[output."DP-1"]
mode = "3440x1440@143.975"
vrr = "fullscreen"
workspaces = 5
direct_scanout = true       # false forces composition on this output
tearing = true              # allow eligible fullscreen clients to request tearing
hdr = "auto"                # "off", "on", metadata-driven "auto", or any-app "fullscreen"
enabled = true              # false removes it; re-enabling restores windows, layout, active workspace, and taskbar entries

# Input ----------------------------------------------------------------------

[input]
middle_click_paste = false      # primary-selection clipboard, applies on reload

[input.keyboard]
layout = "us"               # "us,de" loads both; switch with keyboard-layout-next
variant = ""
options = ""                # XKB options, e.g. "grp:alt_shift_toggle"
repeat_rate = 35            # 0-1000 Hz
repeat_delay = 300          # 0-10000 ms
numlock_toggle = true       # true enables NumLock when a keyboard connects; false leaves it off
track_layout = "global"     # "global", or "window" to track the layout per surface

[input.mouse]
accel_profile = "flat"      # omitted preserves the device's libinput default
sensitivity = 0.0           # pointer speed, -1.0 to 1.0
scroll_wheel_step = 60      # 1-1000

[input.cursor]
theme = "capitaine-cursors"
size = 24                       # 1-512
hardware_cursor = true          # false forces software cursor composition
follows_focus = false           # warp to windows selected by focus navigation
hide_when_typing = false        # hide after typing unless a pointer button is held
hide_timeout_ms = 0             # 0-3600000, 0 disables hiding

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0

